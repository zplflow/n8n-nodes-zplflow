# Publishes @zplflow/n8n-nodes-zplflow to npm on every version tag push
# using GitHub Actions OIDC Trusted Publishing with npm provenance.

name: Publish

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm Trusted Publishing & provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm (OIDC + Provenance)
        run: npm publish --provenance --access public
